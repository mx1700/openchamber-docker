name: Build and publish OpenChamber image

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - ".env.example"
      - "docker-compose.yml"
      - "deploy/**"
      - "scripts/**"
      - ".gitignore"
  schedule:
    # 18:17 UTC = 02:17 Asia/Shanghai. Change if you prefer another window.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: openchamber-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/openchamber" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve OpenChamber and matching OpenCode
        id: versions
        run: |
          openchamber="$(npm view @openchamber/web version | tail -n 1)"
          opencode="$(npm view "@openchamber/web@${openchamber}" dependencies.@opencode/client | tail -n 1)"

          test -n "$openchamber"
          test -n "$opencode"

          echo "openchamber=${openchamber}" >> "$GITHUB_OUTPUT"
          echo "opencode=${opencode}" >> "$GITHUB_OUTPUT"
          echo "OpenChamber ${openchamber} / OpenCode ${opencode}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.openchamber }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=OpenChamber
            org.opencontainers.image.description=OpenChamber Web/Server with matching OpenCode
            org.opencontainers.image.version=${{ steps.versions.outputs.openchamber }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_VERSION=${{ steps.versions.outputs.openchamber }}
            OPENCODE_VERSION=${{ steps.versions.outputs.opencode }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
